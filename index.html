<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Minijuegos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #loader {
            font-size: 18px;
            color: #555;
            font-weight: bold;
        }
        #contenedor-minijuego {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="loader">Cargando tu minijuego, por favor espera...</div>
    <div id="contenedor-minijuego"></div>

    <script>
        // URL directa de tu Web App de Google Apps Script
        const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwnLEqtvL8tAHqXX9lyNwve_2EUP7gzuVhjOtjfv7kItHXvTmiK1cqqfC_adhpIViKx/exec";

        // Extraemos el ID de la URL (ejemplo: ?id=123456)
        const params = new URLSearchParams(window.location.search);
        const idUsuario = params.get("id");

        const loader = document.getElementById("loader");
        const contenedor = document.getElementById("contenedor-minijuego");

        if (!idUsuario) {
            loader.innerHTML = "❌ Error: No se encontró ningún ID en la URL. Usa un enlace con ?id=tu_codigo";
            loader.style.color = "red";
        } else {
            // Hacemos la petición al backend
            fetch(`${URL_BACKEND}?id=${idUsuario}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        loader.style.display = "none";
                        
                        // Inyectamos el HTML directamente
                        contenedor.innerHTML = data.html;

                        // Ejecutamos los scripts internos si el minijuego los trae
                        const scripts = contenedor.getElementsByTagName("script");
                        for (let i = 0; i < scripts.length; i++) {
                            eval(scripts[i].innerHTML);
                        }

                    } else {
                        loader.innerHTML = "❌ " + (data.error || "Ocurrió un error al cargar el minijuego.");
                        loader.style.color = "red";
                    }
                })
                .catch(error => {
                    console.error("Error de conexión:", error);
                    loader.innerHTML = "❌ Error de conexión con el servidor de la base de datos.";
                    loader.style.color = "red";
                });
        }
    </script>

</body>
</html>
